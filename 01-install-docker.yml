---
- name: Install Docker on RHEL 9
  hosts: localhost
  connection: local
  become: true

  tasks:

    - name: Install required packages
      ansible.builtin.dnf:
        name:
          - dnf-plugins-core
          - yum-utils
        state: present
        update_cache: true

    - name: Add Docker CE repository
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/centos/docker-ce.repo
        dest: /etc/yum.repos.d/docker-ce.repo
        mode: '0644'

    - name: Install Docker
      ansible.builtin.dnf:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: Start Docker
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

    - name: Add azureuser to docker group
      ansible.builtin.user:
        name: azureuser
        groups: docker
        append: true

    - name: Verify Docker service
      ansible.builtin.command:
        cmd: systemctl is-active docker
      register: docker_status
      changed_when: false

    - name: Display Docker status
      ansible.builtin.debug:
        msg: "Docker service status: {{ docker_status.stdout }}"
